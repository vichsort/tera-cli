api:
  name: "My Awesome API"
  version: "1.0.0"
  description: "A short introduction to My Awesome API."

endpoints:
  - method: GET
    path: /health
    summary: Health Check
    description: Verifies the API is running.
    responses:
      success:
        status: 200
        description: API is running
        example: { "status": "ok" }