[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tera-cli"
version = "0.1.0"
description = "Documentation as Code Tool - Intermediate Representation (IR) Hub for API Specs"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vitor Mignoni", email = "vichsort@proton.me" },
]
requires-python = ">=3.10"
keywords = ["openapi", "swagger", "api-documentation", "flask", "cli", "documentation-as-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
    "typer>=0.12.0",
    "Flask>=3.0.0",
    "Jinja2>=3.1.0",
    "PyYAML>=6.0.0",
    "pathspec>=0.12.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "setuptools>=61.0",
    "wheel",
    "pyright>=1.1.0",
]

[project.scripts]
tera = "tera.main:start"

[project.urls]
Homepage = "https://github.com/vichsort/tera-cli"
Repository = "https://github.com/vichsort/tera-cli"
Issues = "https://github.com/vichsort/tera-cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tera*"]

[tool.setuptools.package-data]
tera = ["templates/*"]

[tool.pyright]
include = ["tera", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.10"